<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>
<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://lojagoldentec.vteximg.com.br/arquivos/ids/166761-600-600/image-224acc37069842568a859bd4cdd15ab8.jpg?v=638590603445700000" alt="Mouse Gamer Brend GT with Cabel.">
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label id="card-name-label" for="card-name">Card Name<span aria-hidden="true">*</span>:</label>
            <input id="card-name" name="card-name" type="text" required><br>

            <label id="card-number-label" for="card-number">Card Number<span aria-hidden="true">*</span>:</label>
            <input id="card-number" name="card-number" type="text" required aria-describedby="card-number-help">
            <p id="card-number-help">Format: ******-**</p>
        </form>
    </section>
</body>
</html>
