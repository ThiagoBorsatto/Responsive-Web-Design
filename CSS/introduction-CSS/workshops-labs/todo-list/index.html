<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="clear-house">
            <label for="clear-house">Clear House</label>
            <ul class="sub-item">
                <li><a href="https://github.com/ThiagoBorsatto" class="sub-item-link" target="_blank">Buy Cleaning Products</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="dog-food">
            <label for="dog-food">Dog Food</label>
            <ul class="sub-item">
                <li><a href="https://github.com/ThiagoBorsatto" class="sub-item-link" target="_blank">Buy Dog Food</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="look-jobs">
            <label for="look-jobs">Look Jobs</label>
            <ul class="sub-item">
                <li><a href="https://github.com/ThiagoBorsatto" class="sub-item-link" target="_blank">Look for Jobs</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="game-night">
            <label for="game-night">Game Night</label>
            <ul class="sub-item">
                <li><a href="https://github.com/ThiagoBorsatto" class="sub-item-link" target="_blank">Gaming with friends</a></li>
            </ul>
        </li>
    </ul>
</body>

</html>
